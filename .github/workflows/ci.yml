name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitized generated-cartridge and deployment tests
        run: bash tools/test.sh
      - name: Publication content check
        run: python3 tools/check_public.py
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C3 firmware (no ROM required)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c3
          idf.py build
